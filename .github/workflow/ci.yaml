name: GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r analytics/requirements.txt

      - name: Run tests
        run: |
          pytest analytics/tests

      - name: Run tests with coverage
        run: |
          pip install pytest pytest-cov mypy pydantic
          mypy analytics
          pytest --cov=analytics --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml


  analytics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache repos
        uses: actions/cache@v4
        with:
          path: repos
          key: repos-${{ runner.os }}
          restore-keys: repos-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc python3-pip
          pip install matplotlib plotly pyyaml jq

      - name: Collect repositories & metadata
        run: python -m analytics.cli collect-data --username toxicmender

      - name: Analyze LOC
        run: python -m analytics.cli analyze-data

      - name: Compute metrics
        run: |
          python scripts/categorize.py
          python scripts/efficiency.py
          python scripts/impact.py
          python scripts/normalize.py
          python scripts/engineering_score.py

      - name: Generate visuals
        run: python -m analytics.cli visualize-data

      - name: Generate README
        run: python -m analytics.cli render-readme

      - name: Commit updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update GitHub profile analytics" || exit 0
          git push
