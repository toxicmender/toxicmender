name: GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github


  tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=analytics --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml


  analytics:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Cache repos
        uses: actions/cache@v4
        with:
          path: repos
          key: repos-${{ runner.os }}
          restore-keys: repos-

      - name: Install dependencies
        run: |
          uv sync
          uv pip install matplotlib plotly pyyaml jq

      - name: Collect repositories & metadata
        run: uv run .\main.py collect-data --username toxicmender

      - name: Analyze LOC
        run: uv run .\main.py analyze-data

      - name: Compute metrics
        run: |
          uv run scripts/categorize.py
          uv run scripts/efficiency.py
          uv run scripts/impact.py
          uv run scripts/normalize.py
          uv run scripts/engineering_score.py

      - name: Generate visuals
        run: uv run .\main.py visualize-data

      - name: Generate README
        run: uv run .\main.py render-readme

      - name: Commit updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update GitHub profile analytics" || exit 0
          git push

